name: Logic Conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Makefile'
      - 'implementation_plan/conformance/**'
      - 'swissknife/test/conformance/**'
      - 'swissknife/src/services/**'
      - 'external/ipfs_datasets/ipfs_datasets_py/logic/conformance/**'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init conformance submodules
        run: |
          # Init independently so a missing/unpublished datasets pin does not
          # abort swissknife checkout (git update with multiple paths is atomic).
          git submodule update --init --depth 1 swissknife
          git submodule update --init --depth 1 external/ipfs_datasets || {
            echo "::warning::external/ipfs_datasets pin unavailable; continuing without it"
          }

      - uses: actions/setup-node@v4
        with:
          # Pin Node explicitly; avoid depending on .nvmrc before submodule is ready.
          node-version: '22'
          cache: npm
          cache-dependency-path: swissknife/package-lock.json

      - name: Verify SwissKnife browser-validation toolchain
        working-directory: swissknife
        run: node scripts/verify-browser-toolchain.mjs --receipt "${{ runner.temp }}/swissknife-browser-toolchain-logic-conformance.json"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python conformance engines
        run: |
          python -m pip install -U pip
          python -m pip install z3-solver multiformats

      - name: Install SwissKnife dependencies
        working-directory: swissknife
        run: npm ci

      - name: Run conformance harness
        run: make conformance-ci

      - name: Upload conformance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-conformance
          path: conformance/
